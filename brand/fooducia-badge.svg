  <defs>
    <linearGradient id="fdBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e7a4c"/>
      <stop offset=".55" stop-color="#135a37"/>
      <stop offset="1" stop-color="#0b1510"/>
    </linearGradient>
    <linearGradient id="fdLeafL" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9fd12c"/>
      <stop offset="1" stop-color="#cdf56a"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="58" fill="url(#fdBg)"/>
  <g transform="translate(-11.08 -22.48) scale(1.14)" fill="none">
