packages:
  - "apps/*"
  - "packages/*"
overrides:
  # proxy-addr <2.0.8 mis-parses IPv4-mapped IPv6, which could forge the client IP the rate limiter
  # counts. Express 4.22.3 still pins 2.0.7; force the patched floor. (CF-Connecting-IP is the real
  # mitigation once the origin lock is on, but the floor should be safe regardless.)
  proxy-addr: '>=2.0.8'
  # Security hygiene (2026-10-19 audit): floor transitive deps to their patched versions. These are
  # all backward-compatible patch/minor bumps of utility libs; the vulns are DoS/ReDoS-class and the
  # runtime-reachable ones (qs) sit behind Cloudflare + app rate limiting. See SECURITY-AUDIT-REPORT.md.
  qs: '>=6.16.0'
  source-map-js: '>=1.2.2'
  braces: '>=3.0.3'
  brace-expansion: '>=5.0.12'
  compression: '>=1.8.2'
  uuid: '>=11.1.1'
  decode-uri-component: '>=0.5.0'
  postcss-selector-parser: '>=7.1.6'
  shell-quote: '>=1.11.0'
  effect: '>=3.20.0'
  deepmerge-ts: '>=8.0.0'
  # NOTE (audit 2026-10-19): a few remaining advisories can't be floored and are all build/dev-only,
  # never shipped to the deployed API or the app bundle: `braces`<=3.0.3 and `node-forge`<=1.4.0 have
  # NO patched release yet; `tinypool` and `@vitest/mocker` would require vitest 4 (test runner only);
  # `deepmerge-ts`>=8 is a major bump of a transitive. None is reachable by an attacker in production.
nodeLinker: hoisted
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  esbuild: true
  prisma: true
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.22 || 57.0.24'
  - expo-modules-core@57.0.16 || 57.0.18
  - expo-modules-jsi@57.0.8
  - expo@57.0.20 || 57.0.22
  - '@expo/ui@57.0.16 || 57.0.18'
  - expo-location@57.0.16 || 57.0.17
  - expo-notifications@57.0.17 || 57.0.18
  - expo-router@57.0.19 || 57.0.21
  - '@expo/fingerprint@0.20.13'
  - '@expo/prebuild-config@57.0.16'
  - expo-asset@57.0.17
  - expo-constants@57.0.18
  - expo-file-system@57.0.7
  - expo-font@57.0.4
  - expo-keep-awake@57.0.2
  - expo-modules-autolinking@57.0.13
  - expo-application@57.0.3
  - expo-blur@57.0.3
  - expo-clipboard@57.0.2
  - expo-dev-client@57.0.19
  - expo-dev-launcher@57.0.20
  - expo-device@57.0.2
  - expo-eas-client@57.0.4
  - expo-glass-effect@57.0.3
  - expo-haptics@57.0.3
  - expo-image@57.0.5
  - expo-json-utils@57.0.2
  - expo-linear-gradient@57.0.2
  - expo-linking@57.0.10
  - expo-manifests@57.0.2
  - expo-secure-store@57.0.4
  - expo-splash-screen@57.0.9
  - expo-sqlite@57.0.3
  - expo-structured-headers@57.0.1
  - expo-symbols@57.0.3
  - expo-system-ui@57.0.4
  - expo-updates-interface@57.0.2
  - expo-updates@57.0.22
  - expo-image-picker@57.0.20
