packages:
  - "apps/*"
  - "packages/*"
nodeLinker: hoisted
allowBuilds:
  '@prisma/client': set this to true or false
  '@prisma/engines': set this to true or false
  esbuild: set this to true or false
  prisma: set this to true or false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.22'
  - expo-modules-core@57.0.16
  - expo-modules-jsi@57.0.8
  - expo@57.0.20
  - '@expo/ui@57.0.16'
  - expo-location@57.0.16
  - expo-notifications@57.0.17
  - expo-router@57.0.19
