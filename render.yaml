# Render blueprint for the Farm-to-Flat API (Node/Express, pnpm monorepo).
# Deploy: Render Dashboard → New → Blueprint → pick this repo. Then fill the secret env vars
# (marked sync:false) in the dashboard — copy them from apps/api/.env. NEVER commit secrets here.
services:
  - type: web
    name: f2f-api
    runtime: node
    plan: free # cold-starts after ~15 min idle; fine for testing. Upgrade to Starter for always-on.
    rootDir: . # build from the repo root (pnpm workspace)
    # Deploy from `main`. The service was originally connected to `platform/api-and-admin`, which
    # stopped receiving API work on 2026-09-21 while `main` went 56 commits ahead — so fixes were
    # merged, verified and never deployed. Vercel already builds the admin site from `main`; the API
    # follows it here so the two halves cannot drift apart again.
    branch: main
    # pnpm is provided automatically via the root package.json "packageManager" field — do NOT run
    # `corepack enable` (it fails on Render's read-only /usr/bin).
    buildCommand: pnpm install --no-frozen-lockfile && pnpm --filter api exec prisma generate
    startCommand: node apps/api/src/index.js
    healthCheckPath: /health
    autoDeploy: true # redeploy on every push to the connected branch
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # The fixed 123456 code. WhatsApp OTP is now live (template ftf_login_code, approved
      # 2026-10-01), so this is the LAST thing standing between testers and real delivery: while it
      # is "1" with no DEV_OTP_ALLOWLIST, every number gets 123456 and NOTHING is sent, however well
      # MSG91 is configured. Confine it with DEV_OTP_ALLOWLIST first, prove a real send, then DELETE
      # this key. `GET /admin/otp-status` reports which of those states the API is actually in.
      - key: ALLOW_DEV_OTP
        value: "1"
      - key: HOST
        value: 0.0.0.0
      # ── secrets: set these in the Render dashboard (copy from apps/api/.env) ──
      - key: DATABASE_URL # Supabase POOLER url (port 6543, ?pgbouncer=true)
        sync: false
      - key: DIRECT_URL # Supabase DIRECT url (port 5432)
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      # NOT issued by Razorpay — you invent this string and type the SAME value into Razorpay
      # Dashboard → Settings → Webhooks. It is the shared secret both sides sign with, which is how
      # we know a callback really came from them. Until it is set, POST /api/v1/webhooks/razorpay
      # refuses every call: safe, but it means a phone dying mid-checkout leaves the money with
      # Razorpay and no order, and nothing checks the amount actually captured.
      # `GET /admin/payments-status` reports whether the RUNNING process sees it.
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_TOKEN # any long random string; the admin site sends it as x-admin-token
        sync: false
      - key: CORS_ORIGIN # EVERY admin origin, comma-separated — www and bare, each domain
        sync: false
      # Operator sign-in with Google. Both are required before the button appears; see .env.example.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_GOOGLE_EMAILS
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      # AI meal planner: the server calls the provider so the key never ships in the app bundle.
      # At least ONE of these is required for the "Build my plan" feature (else the route returns 501).
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # ── login codes over WhatsApp (MSG91) ──
      # Required together: without all three, whatsappEnabled is false and sign-in answers
      # OTP_CHANNEL_UNCONFIGURED rather than pretending a code was sent.
      - key: MSG91_AUTH_KEY # MSG91 dashboard → Settings → API → Auth Key
        sync: false
      - key: MSG91_WA_NUMBER # the integrated WhatsApp Business number, 91-prefixed: 918688210456
        sync: false
      - key: MSG91_WA_TEMPLATE_NAME # approved AUTHENTICATION template: ftf_login_code
        sync: false
      - key: MSG91_WA_TEMPLATE_LANG # the template's language code, exactly as MSG91 lists it
        value: en_US
      # Numbers that keep the fixed 123456 — testers and staff, comma-separated, 10 digits each.
      # Setting this is what confines ALLOW_DEV_OTP: everyone NOT named here starts getting real
      # WhatsApp codes immediately, so set it before trusting a live sign-in.
      - key: DEV_OTP_ALLOWLIST
        sync: false
      # Order and complaint updates (UTILITY templates). Optional and independent: leave either
      # unset and that notification is simply not sent. WhatsApp carries these because Expo push
      # needs FCM/APNs credentials that do not exist yet, so push is accepted and goes nowhere.
      - key: MSG91_WA_TEMPLATE_DELIVERY # e.g. ftf_order_on_the_way
        sync: false
      - key: MSG91_WA_TEMPLATE_COMPLAINT # e.g. ftf_complaint_update
        sync: false
      # optional: MSG91_WA_TEMPLATE_NAMESPACE (only if the WABA demands one),
      # MSG91_WA_TEMPLATE_BUTTON=0 (template has no copy-code button),
      # OTP_FALLBACK_SMS=1 + MSG91_SENDER_ID + MSG91_OTP_TEMPLATE_ID (SMS fallback — needs DLT),
      # REDIS_URL, SENTRY_DSN
